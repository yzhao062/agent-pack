name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate pack.yaml
        run: python scripts/validate.py

  test-scripts:
    # ubuntu-latest is 26.04, which has no Python 3.9 build, so the 3.9 floor runs on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Run skill script tests
        run: python -m unittest discover -s tests -v
